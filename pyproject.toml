[project]
name = "ios-presentation-bot"
version = "0.1.0"
description = "Interactive iOS presentation poll"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ios_poll*"]

[tool.setuptools.package-data]
ios_poll = ["static/*.html", "static/*.css", "static/*.js"]
