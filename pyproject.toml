[project]
name = "ios-presentation-bot"
version = "0.1.0"
description = "Interactive iOS presentation poll"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ios_poll*"]
