name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Compile modules
        run: python -m compileall -q ios_poll tests
      - name: Check browser JavaScript syntax
        run: node --check ios_poll/static/screen.js
      - name: Import Telegram handlers
        run: python -c "import ios_poll.bot"
      - name: Run tests
        run: python -m pytest -q
